# Settings owned by the patches in patches/, read at patch time.
# Kimi's own settings live in ~/.kimi-code/config.toml, the launcher's in
# env-profile.conf. Defaults are registered in lib/patch_settings.py.

# Height of the slash-command popup: default | half | full
suggestion_height=half

# Add a /wd command for switching the working directory: on | off
wd_command = on

# Click into the composer to place the cursor (fullscreen only): on | off
click_cursor = on

# Extra filenames Kimi accepts as project instructions: off | claude | all
# Kimi's own AGENTS.md keeps priority; at most one plain file per directory is
# ever read, so this can never double the prompt.
agents_md_names=claude

# Prefix each line the Read tool returns with its number: on | off
# Off saves tokens on every file read, and costs the model the ability to cite
# a line number from a Read alone.
read_line_numbers = on

# Reasoning effort per turn, derived from the prompt: off | pin | free
effort_router = off

# The working indicator: default | mirror | custom, or one of the presets
# braille | dots | moon | blocks | wave | glow | colors | arc | star
spinner_style = blocks
# Milliseconds per spinner frame: default, or 20..2000
spinner_interval_ms = default
# The frames `custom` uses. Separated by spaces where there are any, taken one
# character at a time where there are not — so "a b c" and "abc" are the same
# three frames, and a frame made of several characters needs the spaced form.
spinner_frames = default
# Rotate the word beside the spinner: on | off
thinking_verbs = off
# The words to rotate through: default, or your own, comma separated
thinking_verbs_list = default
# Where the word goes; {} is the word
thinking_verbs_format = {}

# Your own messages in the transcript
user_message_marker = none
user_message_border = topbottom
user_message_style = plain

# The frame around the composer: default | off | single | double | bold
input_box_border = default
spinner_mirror=off
expanded_by_default=both
auto_accept_plan=on
fullscreen=on
