# Settings for the patches in patches/.
#
# Plain KEY=value lines, one per setting. Blank lines and everything after a
# `#` are ignored. Values are taken literally — no quoting, no expansion.
#
# Unlike config.toml and env-profile.conf, changes here only take effect after
# a patch run: the values are compiled into the binary. Run ./kimi-patch.sh.

# How tall the slash-command suggestion list may grow.
#
#   default  Kimi's own behaviour, 5 entries. The patch does nothing.
#   half     half the terminal height (the default here)
#   full     as many entries as fit once the composer and status lines are
#            reserved
#
# Counted in *entries*, not screen lines: an entry with a long description
# wraps onto a second line, so a list of N entries can be up to 2N+1 lines
# tall. `full` therefore fills the window only when descriptions are short;
# otherwise the list scrolls internally and shows its `(n/total)` counter.
suggestion_height=half
