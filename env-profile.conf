# kimi-code-mods environment profile
#
# One NAME=value per line. Everything here is exported by bin/kimi before Kimi
# starts. Lines are parsed, not sourced, so no shell expansion happens and the
# value is taken literally. Only names Kimi actually reads are accepted — a
# typo aborts the launch instead of silently doing nothing.
#
# Everything below is commented out, which means "leave Kimi's own default
# alone". Uncomment only what you want to change.

# --- display -------------------------------------------------------------
# The alternate-screen renderer: Kimi takes over the whole terminal and
# restores the previous screen on exit. Confirmed working on 0.36.0.
KIMI_CODE_TUI_FULL_SCREEN=1

# --- transcript window ----------------------------------------------------
# How much history is re-sent每 turn. This is the only lever that lowers the
# *running* cost rather than the cost of starting a session — everything else
# trims what is sent once. `0` disables the individual mechanism.
#
# Lower values mean cheaper turns and a shorter memory. The defaults shown are
# Kimi's own, read from the bundle.
# KIMI_CODE_TUI_MAX_TURNS=15
# KIMI_CODE_TUI_EXPAND_TURNS=3
# KIMI_CODE_TUI_HYSTERESIS=5
# KIMI_CODE_TUI_KEEP_RECENT_STEPS=30
# KIMI_CODE_TUI_KEEP_RECENT_ASSISTANT=20
# KIMI_CODE_TUI_KEEP_RECENT_ASSISTANT_COMPLETED=2

# --- updates --------------------------------------------------------------
# Kimi replaces its own binary in place, which silently removes every patch.
# `KIMI_CODE_NO_AUTO_UPDATE` is the canonical name; `KIMI_CLI_NO_AUTO_UPDATE`
# is a legacy alias the bundle still honours. Accepts 1/true/yes/on.
#
# Prefer lib/kimi-guard.sh if you would rather keep updating and repatch
# afterwards.
# KIMI_CODE_NO_AUTO_UPDATE=1

# --- skills ---------------------------------------------------------------
# Drops Kimi's built-in product skills from the catalogue. Measured on 0.36.0:
# the listed skills go from three to one.
KIMI_CODE_BUILTIN_PRODUCT_SKILLS=0

# --- reasoning -------------------------------------------------------------
# How hard the model thinks. This overrides the level Kimi would otherwise
# choose and, unlike `[thinking] effort` in config.toml, it also bypasses the
# per-model support list — Kimi still clamps a level the model cannot do.
# Accepts off, minimal, low, medium, high, xhigh, max.
# KIMI_MODEL_THINKING_EFFORT=high

# Whether previous thinking is carried into the next request. `all` keeps it,
# `off` drops it. Keeping it costs tokens and buys continuity of reasoning.
# KIMI_MODEL_THINKING_KEEP=all

# Sampling. Both are passed straight through to the provider.
# KIMI_MODEL_TEMPERATURE=0.6
# KIMI_MODEL_TOP_P=0.95

# Ceiling on one response. Unset means the model's own limit.
# KIMI_MODEL_MAX_COMPLETION_TOKENS=8192

# The rest of the KIMI_MODEL_* family is not accepted here, and that is
# deliberate rather than an omission: MAX_CONTEXT_SIZE, CAPABILITIES and the
# others are only read once KIMI_MODEL_NAME defines a complete custom model,
# which then also requires KIMI_MODEL_API_KEY and replaces your default model.
# Setting one of them alone does nothing.

# --- experimental ---------------------------------------------------------
# Normally set through Kimi's own `/experiments` menu, which also shows where
# each value came from. Listed here for completeness; the master switch turns
# on every flag at once.
# KIMI_CODE_EXPERIMENTAL_FLAG=1
# KIMI_CODE_EXPERIMENTAL_SECONDARY_MODEL=1
# KIMI_CODE_EXPERIMENTAL_TOOL_SELECT=1

# --- diagnostics ----------------------------------------------------------
# For when something is wrong, not for everyday use.
# KIMI_CODE_DEBUG=1
# KIMI_STARTUP_TRACE=1
# KIMI_STARTUP_TRACE_LOG=/tmp/kimi-startup-trace.log
# KIMI_TUI_NO_RENDER_CACHE=1
